[package]
name = "rustforge-studio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
serde.workspace = true
rustforge-document = { path = "../rustforge-document" }
serde_json.workspace = true
uuid = { workspace = true, features = ["js"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

leptos = { version = "0.7", features = ["csr"], optional = true }
gloo-net = { version = "0.6", features = ["http"], optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", features = ["console", "Window", "Location", "Storage", "HashChangeEvent", "EventTarget", "StorageEvent", "KeyboardEvent", "FocusEvent", "DomRect", "Node", "Element", "Document", "HtmlElement", "BeforeUnloadEvent", "File", "FileList", "Blob", "BlobPropertyBag", "Url", "FormData", "HtmlInputElement", "HtmlSelectElement"], optional = true }
[features]
default = []
ui = ["dep:leptos", "dep:gloo-net", "dep:wasm-bindgen-futures", "dep:web-sys"]
[[bin]]
name = "rustforge-studio-ui"
path = "src/main.rs"
required-features = ["ui"]
