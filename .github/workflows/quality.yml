name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
        working-directory: admin
      - run: node --test tests/public-comments.test.mjs
      - run: node --experimental-strip-types --test tests/column-preferences.test.mjs
      - run: npm run lint
        working-directory: admin
      - run: npm run build
        working-directory: admin
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
  postgres-regressions:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: regression-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci && npm run build
        working-directory: admin
      - run: cargo test --locked -p rustforge-api --test consolidation -- --include-ignored
        env:
          RUSTFORGE_TEST_DATABASE_URL: postgres://postgres:regression-only@localhost:5432/postgres
      - run: cargo test --locked -p rustforge-core --test jobs_postgres -- --include-ignored
        env:
          RUSTFORGE_TEST_DATABASE_URL: postgres://postgres:regression-only@localhost:5432/postgres

  wasm-document:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo test --locked -p rustforge-document -p rustforge-studio
      - run: cargo build --locked -p rustforge-studio --lib --target wasm32-unknown-unknown
      - run: cargo check --locked -p rustforge-studio --target wasm32-unknown-unknown --features ui --bin rustforge-studio-ui
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: wasm-bindgen target/wasm32-unknown-unknown/debug/rustforge_studio.wasm --target web --out-dir admin/public/wasm --out-name rustforge_studio
      - run: cargo build --locked -p rustforge-studio --example conformance
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tests/document-wasm-parity.mjs
