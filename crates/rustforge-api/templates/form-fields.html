{% if sent %}<p role="status">Votre formulaire a été transmis.</p>{% else %}{% if error %}<p role="alert">{{ error }}</p>{% endif %}<form method="post" action="/forms/{{ form.id }}"><input type="hidden" name="_rf_token" value="{{ token }}"><div hidden aria-hidden="true"><label>Site web<input name="_website" tabindex="-1" autocomplete="off"></label></div>{% for field in fields %}<p><label for="{{ prefix }}-{{ field.key }}">{{ field.label }}</label>{% if field.type == 'boolean' %}<input id="{{ prefix }}-{{ field.key }}" name="{{ field.key }}" type="checkbox" value="true" {% if values and values[field.key] == "true" %}checked{% endif %}>{% elif field.choices %}<select id="{{ prefix }}-{{ field.key }}" name="{{ field.key }}" {% if field.required %}required{% endif %}><option value="">Choisir…</option>{% for option in field.choices %}<option value="{{ option }}" {% if values and values[field.key] == option %}selected{% endif %}>{{ option }}</option>{% endfor %}</select>{% else %}<input id="{{ prefix }}-{{ field.key }}" name="{{ field.key }}" type="{{ field.input_type }}" value="{{ values[field.key] if values else '' }}" {% if field.required %}required{% endif %} {% if field.min is not none %}min="{{ field.min }}"{% endif %} {% if field.max is not none %}max="{{ field.max }}"{% endif %} {% if field.maxlength is not none %}maxlength="{{ field.maxlength }}"{% endif %}>{% endif %}</p>{% endfor %}<button type="submit">Envoyer</button></form>{% endif %}
